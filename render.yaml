services:
  # ==========================================
  # EasyCart Unified Full-Stack Web Service
  # Builds & deploys both Frontend and Backend together
  # ==========================================
  - type: web
    name: easycart
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_EXPIRE
        value: 30d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_ACCESS_CODE
        value: EASYCART_ADMIN_2026
