services:
  # ==========================================
  # EasyCart Backend API (Web Service)
  # ==========================================
  - type: web
    name: easycart-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_EXPIRE
        value: 30d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_ACCESS_CODE
        value: EASYCART_ADMIN_2026

  # ==========================================
  # EasyCart Frontend UI (Static Site)
  # ==========================================
  - type: web
    name: easycart-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
